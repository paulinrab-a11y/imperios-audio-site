<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Impérios Audio Design</title>
<link rel="icon" href="/img/coroa.png">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  html { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(201,162,63,.14), transparent 70%), #070707;
    color: #f2efe8; font-family: Manrope, system-ui, sans-serif; }
  img { width: 90px; margin: 0 auto 20px; display: block; filter: drop-shadow(0 0 16px rgba(236,201,106,.45)); }
  h1 { font: 900 clamp(3rem, 12vw, 7rem)/.9 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif; text-transform: uppercase; margin: 0 0 16px; }
  h1 span { color: #ecc96a; }
  p { color: #a49f95; margin: 0 0 28px; }
  a { display: inline-flex; align-items: center; height: 52px; padding: 0 26px; background: linear-gradient(180deg, #ecc96a, #c9a23f); color: #120d02;
    text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; transition: transform 160ms cubic-bezier(0.23,1,0.32,1); }
  a:active { transform: scale(.97); }
  a:focus-visible { outline: 2px solid #ecc96a; outline-offset: 4px; }
</style>
</head>
<body>
  <main>
    <img src="/img/coroa.png" alt="" width="260" height="112">
    <h1>Essa vaga<br><span>está vazia.</span></h1>
    <p>A página que você procurou não existe ou mudou de lugar.</p>
    <a href="/">Voltar para o início</a>
  </main>
</body>
</html>
